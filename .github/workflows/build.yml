name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match the Cargo.toml version ($version)"
          }

      - name: Build
        run: cargo build --release --locked
        env:
          ASCENDARA_REQUIRE_RESOURCES: "1"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/AscendaraInstaller.exe dist/
          $hash = (Get-FileHash dist/AscendaraInstaller.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AscendaraInstaller.exe" | Out-File -Encoding ascii dist/AscendaraInstaller.exe.sha256
          Get-Content dist/AscendaraInstaller.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AscendaraInstaller
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AscendaraInstaller
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
