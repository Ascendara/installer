[package]
name = "ascendara-installer"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Installer for Ascendara"
publish = false

[[bin]]
name = "AscendaraInstaller"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
ureq = { version = "2.12", features = ["json"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# DirectX 12 backend (includes the WARP software adapter for GPU-less machines)
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Keep debug builds snappy (image resizing / hero rendering)
[profile.dev.package."*"]
opt-level = 2
